<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobPilot Synthetic Application</title>
  </head>
  <body>
    <form id="application-form">
      <section id="step-1">
        <h1>Job application form</h1>
        <label for="first-name">First Name</label>
        <input id="first-name" name="first_name" autocomplete="given-name" placeholder="First name" />

        <label for="last-name">Last Name</label>
        <input id="last-name" name="last_name" autocomplete="family-name" placeholder="Last name" />

        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="email" placeholder="Email" />

        <label for="phone">Phone</label>
        <input id="phone" type="tel" name="phone" autocomplete="tel" placeholder="Phone" />

        <label for="resume">Upload Resume</label>
        <input id="resume" type="file" name="resume" aria-label="Upload Resume" />

        <button type="button" id="next-btn">Next</button>
      </section>

      <section id="step-2" hidden>
        <h1>More information</h1>
        <label for="linkedin">LinkedIn</label>
        <input id="linkedin" name="linkedin" placeholder="LinkedIn" />

        <label for="work-auth">Are you legally authorized to work in the United States?</label>
        <select id="work-auth" name="work_authorization">
          <option value="">Select</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
        <button type="button" id="continue-btn">Continue</button>
      </section>

      <section id="step-3" hidden>
        <h1>Review</h1>
        <p>Review your application before submitting.</p>
        <button type="submit" id="submit-btn">Submit Application</button>
      </section>
    </form>
    <script>
      document.getElementById('next-btn').addEventListener('click', function () {
        document.getElementById('step-1').hidden = true
        document.getElementById('step-2').hidden = false
      })
      document.getElementById('continue-btn').addEventListener('click', function () {
        document.getElementById('step-2').hidden = true
        document.getElementById('step-3').hidden = false
      })
      document.getElementById('application-form').addEventListener('submit', function (event) {
        event.preventDefault()
      })
    </script>
  </body>
</html>
